<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Clicker – Offline</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
}

body{
  font-family:'Comic Sans MS','Segoe UI',cursive,sans-serif;
  background: linear-gradient(160deg, #ffe6f0, #fff0b3, #b3f0ff, #c1ffc1);
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
}

/* 🌈 PADAJÍCÍ OVOCE */
.falling{
  position:fixed;
  top:-50px;
  pointer-events:none;
  z-index:0;
  opacity:.85;
  animation:fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-60px);}
  to{transform:translateY(110vh);}
}

/* 🎮 HLAVNÍ PANEL */
.panel{
  background:rgba(255,255,255,0.97);
  border-radius:40px;
  padding:50px;
  width:min(700px,92vw);
  text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,.18);
  position:relative;
  z-index:1;
  backdrop-filter: blur(8px);
}

/* 🏷 NADPIS */
h1{
  font-size:40px;
  margin-bottom:20px;
}

/* 🖼 LOGO */
.game-logo{
  width:220px;
  max-width:75%;
  margin:0 auto 25px;
  display:block;
  filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));
  animation: float 3s ease-in-out infinite;
}

@keyframes float{
  0%{ transform:translateY(0px); }
  50%{ transform:translateY(-10px); }
  100%{ transform:translateY(0px); }
}

/* 💬 MESSAGE BOX */
.message{
  background:#fff0f5;
  padding:22px;
  border-radius:25px;
  margin-top:15px;
  font-size:20px;
  box-shadow:0 10px 20px rgba(0,0,0,.12);
  line-height:1.5;
}

/* 🔘 BUTTON */
button{
  margin-top:28px;
  background:#ff66aa;
  border:none;
  color:white;
  padding:16px 28px;
  font-size:18px;
  border-radius:999px;
  cursor:pointer;
  font-weight:bold;
  transition:.25s;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

button:hover{
  transform:scale(1.12);
  background:#ff3399;
}
</style>
</head>

<body>

<div class="panel">
  <h1>🍓 Fruit Clicker</h1>

  <img src="logo.png" class="game-logo" alt="Fruit Clicker">

  <div class="message">
    <b>Cookie says:</b><br>
    You lost your internet connection 🍪<br>
    Connect again and keep clicking!
  </div>

  <button onclick="location.reload()">🔄 Try again !!</button>
</div>

<script>
const fruits=["🍓","🍌","🍎","🍍","🍉","🍑","🍊"];

for(let i=0;i<22;i++){
  const f=document.createElement("div");
  f.className="falling";
  f.textContent=fruits[Math.floor(Math.random()*fruits.length)];
  f.style.left=Math.random()*100+"vw";
  f.style.animationDuration=(7+Math.random()*7)+"s";
  f.style.fontSize=(28+Math.random()*36)+"px";
  f.style.animationDelay=(-Math.random()*10)+"s";
  document.body.appendChild(f);
}
</script>

</body>
</html>
