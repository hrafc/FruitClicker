<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Clicker – Offline</title>

<style>
  .game-logo{
  width:160px;
  max-width:70%;
  margin:10px auto 20px;
  display:block;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
  animation: float 3s ease-in-out infinite;
}

@keyframes float{
  0%{ transform:translateY(0px); }
  50%{ transform:translateY(-8px); }
  100%{ transform:translateY(0px); }
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}

body{
  font-family:'Comic Sans MS','Segoe UI',cursive,sans-serif;
  background: linear-gradient(160deg, #ffe6f0, #fff0b3, #b3f0ff, #c1ffc1);
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
}

/* stejné padající ovoce jako ve hře */
.falling{
  position:fixed;
  top:-50px;
  pointer-events:none;
  z-index:0;
  opacity:.8;
  font-size:42px;
  animation:fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-60px);}
  to{transform:translateY(110vh);}
}

/* hlavní karta = stejný styl jako hra */
.panel{
  background:#fff8f0;
  border-radius:32px;
  padding:30px;
  width:min(520px,90vw);
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  position:relative;
  z-index:1;
}

h1{
  font-size:32px;
  margin-bottom:10px;
}

.cookie{
  font-size:80px;
  margin:10px 0;
  animation:wiggle 2s ease-in-out infinite;
}

@keyframes wiggle{
  0%,100%{transform:rotate(0);}
  50%{transform:rotate(8deg);}
}

.message{
  background:#fff0f5;
  padding:16px;
  border-radius:20px;
  margin-top:15px;
  font-size:18px;
  box-shadow:0 8px 16px rgba(0,0,0,.1);
}

button{
  margin-top:18px;
  background:#ff66aa;
  border:none;
  color:white;
  padding:14px 22px;
  font-size:16px;
  border-radius:999px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
  box-shadow:0 6px 14px rgba(0,0,0,.2);
}

button:hover{
  transform:scale(1.1);
  background:#ff3399;
}
</style>
</head>

<body>

<div class="panel">
  <h1>🍓 Fruit Clicker</h1>

  <img src="logo.png" class="game-logo" alt="Fruit Clicker">

  <div class="message">
    <b>Cookie says:</b><br>
    „You have lost your internet connection.<br>
    Connect to the internet and keep clicking.“
  </div>

  <button onclick="location.reload()">🔄 Try again !!</button>
</div>

<script>
/* jemné padající ovoce */
const fruits=["🍓","🍌","🍎","🍍","🍉","🍑","🍊"];
for(let i=0;i<18;i++){
  const f=document.createElement("div");
  f.className="falling";
  f.textContent=fruits[Math.floor(Math.random()*fruits.length)];
  f.style.left=Math.random()*100+"vw";
  f.style.animationDuration=(8+Math.random()*8)+"s";
  f.style.fontSize=(24+Math.random()*30)+"px";
  f.style.animationDelay=(-Math.random()*10)+"s";
  document.body.appendChild(f);
}
</script>

</body>
</html>
