<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Clicker 🌸</title>

<link rel="icon" type="image/png" href="logo.png?v=5">
<link rel="apple-touch-icon" href="logo.png?v=5">
<meta name="theme-color" content="#ff66aa">

<style>
*{user-select:none; box-sizing:border-box; margin:0; padding:0;}

body{
  font-family:'Comic Sans MS','Segoe UI',cursive,sans-serif;
  background: linear-gradient(160deg,#ffe6f0,#fff0b3,#b3f0ff,#c1ffc1);
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.falling{
  position:fixed;
  top:-50px;
  pointer-events:none;
  z-index:0;
  opacity:.8;
  font-size:50px;
  animation:fall linear infinite;
}

@keyframes fall{
  0%{transform:translateY(-50px);}
  100%{transform:translateY(110vh);}
}

.app{
  background:#fff8f0;
  border-radius:32px;
  padding:25px;
  width:min(900px,92vw);
  transform:scale(1.15);
  transform-origin:center;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  position:relative;
  z-index:1;
}

.top-left{
  position:absolute;
  top:14px;
  left:18px;
  background:#ff99cc;
  color:white;
  padding:8px 14px;
  border-radius:999px;
  font-weight:900;
}

.menu-btn{
  position:absolute;
  top:14px;
  right:18px;
  background:#ff66aa;
  color:white;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  font-weight:800;
}

.fruit{
  font-size:140px;
  cursor:pointer;
  margin:12px 0;
}

.progress{
  height:20px;
  background:#ffe6f0;
  border-radius:999px;
  overflow:hidden;
  margin:12px 0;
}
.bar{
  height:100%;
  background: linear-gradient(90deg,#ff99cc,#ff66aa,#ff3399);
  width:0%;
}

.upgrade{
  background:#fff0f5;
  border-radius:20px;
  padding:14px;
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.upgrade button{
  background:#ff99cc;
  border:none;
  color:white;
  padding:12px 20px;
  border-radius:24px;
  font-weight:bold;
  cursor:pointer;
}

.menu-screen{display:none; margin-top:20px;}
.levels{display:grid; gap:12px;}
.level-item{
  background:#fff0f5;
  padding:14px;
  border-radius:20px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
  font-weight:700;
}
.level-item.locked{
  opacity:.4;
  cursor:not-allowed;
}

.reset-btn{
  width:100%;
  margin-top:14px;
  background:linear-gradient(135deg,#ff9ad5,#ffd1ea);
  border:none;
  padding:12px;
  border-radius:18px;
  font-weight:900;
  cursor:pointer;
}

@media (max-width:520px){
  .app{transform:scale(1);width:94vw;}
  .fruit{font-size:110px;}
}
</style>
</head>

<body>

<div class="app">

<div class="top-left">🪙 <span id="coins">0</span></div>
<div class="menu-btn" id="menuBtn">🏠 Menu</div>

<div id="game">
<h1>🍓 Fruit Clicker 🌸</h1>
<div id="levelText"></div>
<div class="fruit" id="fruit"></div>
<div id="clickText"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="needText"></div>

<h3>⬆️ UPGRADES</h3>

<div class="upgrade">
<div><b>Auto Clicker</b><br><small id="autoCost">Price: 3000</small></div>
<button id="buyAuto">Buy</button>
</div>

<div class="upgrade">
<div><b>Coin Multiplier</b><br><span id="coinInfo"></span><br><small id="coinCost"></small></div>
<button id="buyCoin">Buy</button>
</div>

<div class="upgrade">
<div><b>Click Multiplier</b><br><span id="clickInfo"></span><br><small id="clickCost"></small></div>
<button id="buyClick">Buy</button>
</div>

</div>

<div id="menu" class="menu-screen">
<h2>📋 Level selection</h2>
<div class="levels" id="levels"></div>
</div>

<button id="resetBtn" class="reset-btn">🧁 Reset progress</button>
</div>

<script>
const $=id=>document.getElementById(id);

const multiplierPrices=[200,500,800,1300,1999,2400,3000,4500,5500,6500];

const levels=[
["Cookie","🍪",250],
["Watermelon","🍉",500],
["Apple","🍎",750],
["Banana","🍌",1000],
["Pineapple","🍍",1250],
["Orange","🍊",1500],
["Pickle","🥒",1750],
["Tomato","🍅",2000],
["Peach","🍑",2250],
["Plum","🍇",2500]
];

let s = JSON.parse(localStorage.getItem("fruitSave")) || {
lvl:0, unlock:0, clicks:Array(10).fill(0),
coins:0,
coinMult:1, clickMult:1,
coinBought:0, clickBought:0,
auto:false,
completed:false
};

let autoInterval=null;

function save(){localStorage.setItem("fruitSave",JSON.stringify(s));}

function startAuto(){
if(autoInterval) clearInterval(autoInterval);
if(s.auto) autoInterval=setInterval(doClick,1000);
}

function render(){
const l=levels[s.lvl];
$("coins").textContent=s.coins;
$("levelText").textContent=`Level ${s.lvl+1} – ${l[0]}`;
$("fruit").textContent=l[1];
$("clickText").textContent=`Clicks: ${s.clicks[s.lvl]}`;
$("needText").textContent=`You have to click: ${l[2]}`;
$("bar").style.width=Math.min(100,(s.clicks[s.lvl]/l[2])*100)+"%";

$("coinInfo").textContent=`${s.coinMult}×`;
$("clickInfo").textContent=`${s.clickMult}×`;

renderLevels();
}

function renderLevels(){
$("levels").innerHTML="";
levels.forEach((lvl,i)=>{
const div=document.createElement("div");
div.className="level-item"+(i>s.unlock?" locked":"");
div.textContent=`Level ${i+1} – ${lvl[0]}`;
if(i<=s.unlock){
div.onclick=()=>{s.lvl=i;save();render();showGame();};
}
$("levels").appendChild(div);
});
}

function doClick(){
s.clicks[s.lvl]+=s.clickMult;
s.coins+=s.coinMult;

if(s.clicks[s.lvl]>=levels[s.lvl][2]){
if(s.lvl<9){
s.unlock=Math.max(s.unlock,s.lvl+1);
s.lvl++;
}
}
save();
render();
}

$("fruit").onclick=doClick;

$("buyCoin").onclick=()=>{
const price=multiplierPrices[s.coinBought];
if(s.coinBought>=10||s.coins<price)return;
s.coins-=price;
s.coinMult++;
s.coinBought++;
save();render();
};

$("buyClick").onclick=()=>{
const price=multiplierPrices[s.clickBought];
if(s.clickBought>=10||s.coins<price)return;
s.coins-=price;
s.clickMult++;
s.clickBought++;
save();render();
};

$("buyAuto").onclick=()=>{
if(s.auto||s.coins<3000)return;
s.coins-=3000;
s.auto=true;
startAuto();
save();render();
};

function showMenu(){
$("game").style.display="none";
$("menu").style.display="block";
}

function showGame(){
$("menu").style.display="none";
$("game").style.display="block";
}

$("menuBtn").onclick=()=>{
if($("menu").style.display==="block") showGame();
else showMenu();
};

$("resetBtn").onclick=()=>{
localStorage.removeItem("fruitSave");
location.reload();
};

startAuto();
render();
</script>

</body>
</html>
